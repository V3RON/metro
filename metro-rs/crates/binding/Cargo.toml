[package]
name = "metro-rs-binding"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "napi-rs binding that exposes the Metro Rust core to Node."

[lib]
name = "metro_rs"
crate-type = ["cdylib"]

[dependencies]
metro-rs-core = { path = "../core" }
metro-rs-source-map = { path = "../source-map" }
metro-rs-cache-key = { path = "../cache-key" }
metro-rs-file-store = { path = "../file-store" }
metro-rs-file-map = { path = "../file-map" }
metro-rs-haste = { path = "../haste" }
metro-rs-graph = { path = "../graph" }
metro-rs-resolver = { path = "../resolver" }
napi = { version = "2", default-features = false, features = ["napi3"] }
napi-derive = "2"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[build-dependencies]
napi-build = "2"
