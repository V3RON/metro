[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/ob1",
  "crates/source-map",
  "crates/cache-key",
  "crates/resolver",
  "crates/file-store",
  "crates/file-map",
  "crates/haste",
  "crates/graph",
  "crates/serializer",
  "crates/binding",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Faster-to-compile build for the gate's compile and test stages. The
# performance gate and phase reports always use the full release profile.
[profile.dev-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
